# GitHub Pages 자동 배포
# - 이 브랜치에 push 할 때마다 index.html을 웹페이지로 올립니다.
# - 주소: https://shin-changhee.github.io/mydashboard/
name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/happy-albattani-nulgqe"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 웹에 올릴 파일만 따로 모으기 (계획서 등은 제외)
      - name: Prepare site
        run: mkdir _site && cp index.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
