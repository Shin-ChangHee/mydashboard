<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무 커맨드센터</title>

  <style>
    /* =========================================================
       1. 디자인 변수 (색상·글꼴)
       - 색을 바꾸고 싶으면 여기 값만 고치면 화면 전체에 반영됩니다.
       ========================================================= */
    :root {
      color-scheme: dark;     /* 스크롤바·입력창도 어두운 모양으로 */

      /* 기본 색상: "야간 경기장의 전광판" */
      --bg: #141B26;          /* 전체 배경 (깊은 남색) */
      --surface: #1C2533;     /* 영역 배경 */
      --line: #2B3747;        /* 구분선, 타임라인 격자 */
      --text: #E4E9F0;        /* 본문 글자 */
      --text-sub: #8B98AA;    /* 보조 글자, 시간 눈금 */
      --scoreboard: #F4B740;  /* 전광판 앰버: 카운트다운·현재 시각 선 전용 */
      --danger: #EE6C6A;      /* D-3 이내 마감 */
      --warn: #E99A4F;        /* D-7 이내 마감 */
      --today: #222D3D;       /* 타임라인에서 오늘 열 배경 (surface보다 살짝 밝게) */

      /* 카테고리 기본 색상 (2단계부터 일정 블록에 사용) */
      --cat-meeting: #6FA8DC;   /* 회의 */
      --cat-focus: #7CC4A4;     /* 집중 업무 */
      --cat-external: #B394D9;  /* 외부 일정 */
      --cat-admin: #9AA6B8;     /* 행정·결재 */
      --cat-personal: #E58C78;  /* 개인(운동 등) */

      /* 글꼴: 외부에서 불러오지 않고 PC에 설치된 글꼴을 순서대로 사용 */
      --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;

      /* 간격 */
      --gap: 1px;        /* 영역 사이 구분선 두께 (배경색이 선처럼 보이게) */
      --pad: 20px;       /* 영역 안쪽 여백 */

      /* 타임라인 1시간의 세로 높이 (값을 키우면 타임라인이 길어집니다) */
      --hour-h: 52px;
    }

    /* =========================================================
       2. 기본 스타일 초기화
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    button {
      font: inherit;
      color: inherit;
    }

    /* 키보드(Tab)로 이동할 때 현재 위치가 잘 보이도록 포커스 테두리 표시 */
    :focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* 숫자 자릿수가 흔들리지 않게 (시계·카운트다운·D-day·진행률) */
    .num { font-variant-numeric: tabular-nums; }

    /* =========================================================
       3. 전체 레이아웃 (격자)
       - 위에서부터: [A] 상단 바 / [B]+[C][D] / [E] / [F]
       - 영역 사이 1px 틈으로 --line 색이 비쳐 구분선 역할을 합니다.
       ========================================================= */
    .app {
      display: grid;
      grid-template-columns: minmax(0, 68fr) minmax(0, 32fr); /* 타임라인 약 68% */
      grid-template-areas:
        "top      top"
        "timeline side"
        "tasks    tasks"
        "tools    tools";
      grid-template-rows: auto minmax(560px, 1fr) auto auto;
      gap: var(--gap);
      background: var(--line);  /* 틈 사이로 보이는 구분선 색 */
      min-height: 100vh;
    }

    .area {
      background: var(--surface);
      padding: var(--pad);
      min-width: 0;  /* 내용이 길어도 격자가 넘치지 않게 */
    }

    /* 각 영역의 격자 위치 지정 */
    .area-top      { grid-area: top; background: var(--bg); }
    .area-timeline { grid-area: timeline; }
    .area-tasks    { grid-area: tasks; }
    .area-tools    { grid-area: tools; background: var(--bg); }

    /* 오른쪽 열: [C] 마감 + [D] 오늘 할 일을 위아래로 */
    .side {
      grid-area: side;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: var(--gap);
      background: var(--line);
      min-width: 0;
    }

    /* 아직 만들지 않은 영역에 보여줄 안내 문구 */
    [hidden] { display: none !important; }

    .placeholder {
      color: var(--text-sub);
      font-size: 14px;
      margin: 0;
    }

    /* =========================================================
       4. [A] 상단 바
       ========================================================= */
    .area-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px 40px;
      padding-top: 16px;
      padding-bottom: 16px;
    }

    /* 왼쪽: 날짜 + 시계 */
    .clock {
      display: flex;
      align-items: baseline;
      gap: 20px;
    }
    .clock-date {
      font-size: 18px;
      font-weight: 600;
    }
    .clock-time {
      font-size: 18px;
      color: var(--text-sub);
    }

    /* 오른쪽: 퇴근 카운트다운 (화면에서 유일하게 강하게 빛나는 요소) */
    .countdown {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .countdown-label {
      font-size: 14px;
      color: var(--text-sub);
    }
    .countdown-value {
      font-size: 44px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--scoreboard);
      white-space: nowrap;
    }
    /* "시간", "분" 같은 단위 글자는 숫자보다 작게 */
    .countdown-value .unit {
      font-size: 20px;
      font-weight: 600;
      margin: 0 8px 0 2px;
    }
    .countdown-value .unit:last-child { margin-right: 0; }

    /* 상태 문구("출근 전", "퇴근 완료", "주말")일 때는 차분한 색으로 */
    .countdown-value.is-status {
      font-size: 28px;
      color: var(--text-sub);
    }

    /* 오늘 근무 진행률 막대 */
    .workbar {
      width: 200px;
      height: 8px;
      background: var(--line);
      border-radius: 4px;
      overflow: hidden;
    }
    .workbar-fill {
      height: 100%;
      width: 0%;
      background: var(--scoreboard);
      border-radius: 4px;
      transition: width 0.6s ease;
    }
    .workbar-text {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* =========================================================
       5. [F] 바로가기 & 도구
       ========================================================= */
    .area-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 14px;
      padding-bottom: 14px;
    }
    .tools-links {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .tools-title {
      font-size: 14px;
      color: var(--text-sub);
      margin-right: 4px;
    }
    .tools-buttons { display: flex; gap: 8px; }

    /* 기본 버튼 모양: 얇은 테두리만 있는 조용한 버튼 */
    .btn {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: var(--surface); }
    .btn:disabled {
      cursor: not-allowed;
      color: var(--text-sub);
    }
    .btn:disabled:hover { background: transparent; }

    /* =========================================================
       6. [B] 이번 주 타임라인
       - 왼쪽에 시간 눈금, 오른쪽에 월~금 5개 열
       - 일정 블록은 각 요일 열 안에 "절대 위치"로 올려놓습니다.
         (위에서 몇 px, 높이 몇 px인지 JavaScript가 계산)
       ========================================================= */
    .area-timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 제목 + 주 이동 버튼 줄 */
    .tl-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
    }
    .tl-head h2 { margin: 0; }
    .tl-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .tl-range {
      font-size: 14px;
      color: var(--text-sub);
    }
    .tl-actions { display: flex; gap: 8px 12px; flex-wrap: wrap; }
    .tl-nav { display: flex; gap: 4px; }
    .tl-nav .btn { padding: 4px 12px; }
    /* 지금 보고 있는 주가 "이번 주"이면 버튼을 눌린 모양으로 */
    .tl-nav .btn[aria-pressed="true"] {
      background: var(--line);
      border-color: var(--line);
    }

    /* 화면이 아주 좁을 때는 타임라인만 옆으로 스크롤 */
    .tl-scroll {
      overflow-x: auto;
    }

    /* 타임라인 격자: [시간 눈금 열] + [요일 5열] */
    .tl-grid {
      display: grid;
      grid-template-columns: 44px repeat(5, minmax(0, 1fr));
      min-width: 520px;
    }

    /* 요일 머리글 (월 10/5) */
    .tl-dayhead {
      padding: 6px 8px;
      font-size: 14px;
      color: var(--text-sub);
      border-left: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .tl-dayhead .day-name {
      color: var(--text);
      font-weight: 600;
    }
    .tl-dayhead.is-today { background: var(--today); }
    .tl-dayhead .today-mark {
      font-size: 12px;
      color: var(--text);
      margin-left: auto;
    }
    .tl-corner { border-bottom: 1px solid var(--line); }

    /* 왼쪽 시간 눈금 */
    .tl-hours {
      position: relative;
    }
    .tl-hour-label {
      position: absolute;
      right: 8px;
      font-size: 12px;
      color: var(--text-sub);
      transform: translateY(-50%);   /* 숫자 가운데가 선에 오도록 */
    }
    .tl-hour-label:first-child { transform: none; }

    /* 요일 한 칸(열): 1시간마다 가로선을 배경 그림으로 그림 */
    .tl-col {
      position: relative;
      border-left: 1px solid var(--line);
      background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: 100% var(--hour-h);
    }
    .tl-col.is-today { background-color: var(--today); }

    /* 일정 블록: 카테고리 색 20% 배경 + 왼쪽 4px 진한 띠 */
    .tl-event {
      position: absolute;
      overflow: hidden;
      padding: 3px 6px 3px 8px;
      border-left: 4px solid var(--cat-color);
      border-radius: 0 4px 4px 0;
      background: var(--cat-bg);
      font-size: 13px;
      line-height: 1.3;
    }
    .tl-event-title {
      display: block;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tl-event-time {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      white-space: nowrap;
    }
    /* 30분 이하로 짧은 일정은 시간 줄을 숨기고 제목만 */
    .tl-event.is-short .tl-event-time { display: none; }

    /* 현재 시각 가로선 (전광판 앰버) */
    .tl-now {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--scoreboard);
      z-index: 2;
      pointer-events: none;
    }
    /* 선 왼쪽 끝의 작은 점 */
    .tl-now::before {
      content: "";
      position: absolute;
      left: -5px;
      top: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--scoreboard);
    }

    /* 이번 주에 일정이 하나도 없을 때 안내 문구 */
    .tl-empty {
      color: var(--text-sub);
      font-size: 14px;
      margin: 0;
    }


    /* 빈 칸을 누르면 일정을 추가할 수 있다는 걸 마우스 모양으로 알려줌 */
    .tl-col { cursor: pointer; }

    /* 일정 블록은 누를 수 있는 버튼이므로 버튼 기본 모양을 지움 */
    button.tl-event {
      text-align: left;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      border-top: 0;
      border-right: 0;
      border-bottom: 0;
      cursor: pointer;
    }
    button.tl-event:hover { filter: brightness(1.15); }

    /* 강조 버튼 (저장 등) */
    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 600;
    }
    .btn-primary:hover { background: #FFFFFF; }
    /* 위험한 동작 버튼 (삭제) */
    .btn-danger {
      color: var(--danger);
      border-color: var(--danger);
    }
    .btn-danger:hover { background: rgba(238, 108, 106, 0.12); }

    /* =========================================================
       입력 창(모달): 일정 추가/수정
       - <dialog>를 사용하면 Esc 닫기, 포커스 가두기가 기본으로 됩니다.
       ========================================================= */
    .dialog {
      width: min(460px, calc(100% - 32px));
      padding: 0;                 /* 여백은 안쪽 form에 줌 (바깥 클릭 감지용) */
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
    }
    .dialog::backdrop { background: rgba(8, 12, 18, 0.65); }

    .dialog-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
    }
    .dialog-form h2 { margin: 0; font-size: 18px; }

    /* 입력 칸 한 줄: 이름표 + 입력 */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .field-label {
      font-size: 13px;
      color: var(--text-sub);
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .input {
      width: 100%;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .input:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 0;
    }
    textarea.input { resize: vertical; min-height: 60px; }

    /* 반복 요일 선택 (월~금 체크 버튼) */
    .repeat-days {
      border: 0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .repeat-days legend { padding: 0; margin-bottom: 6px; }
    .day-checks { display: flex; gap: 6px; flex-wrap: wrap; }
    .day-check input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }
    .day-check span {
      display: inline-block;
      min-width: 40px;
      text-align: center;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }
    .day-check input:checked + span {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 600;
    }
    .day-check input:focus-visible + span {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    .form-hint {
      font-size: 13px;
      color: var(--text-sub);
      margin: 0;
    }
    .form-error {
      font-size: 14px;
      color: var(--danger);
      margin: 0;
    }

    /* 아래 버튼 줄: 왼쪽 삭제, 오른쪽 취소·저장 */
    .dialog-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 4px;
    }
    .dialog-actions .spacer { flex: 1; }

    /* 화면 아래에 잠깐 뜨는 알림 ("저장했어요" 등) */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
      max-width: calc(100% - 32px);
    }
    .toast.is-error { background: var(--danger); }

    /* =========================================================
       7. 반응형 (화면 폭에 따라 배치 변경)
       ========================================================= */

    /* 1366px 이하: [C]·[D]가 타임라인 아래로 내려가는 1단 구성 */
    @media (max-width: 1366px) {
      .app {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "top"
          "timeline"
          "side"
          "tasks"
          "tools";
        grid-template-rows: auto minmax(520px, auto) auto auto auto;
      }
      /* 마감과 할 일은 좌우로 나란히 */
      .side {
        grid-template-rows: none;
        grid-template-columns: 1fr 1fr;
      }
    }

    /* 태블릿 세로 폭 이하: 마감과 할 일도 위아래로 */
    @media (max-width: 820px) {
      :root { --pad: 16px; }
      .side { grid-template-columns: 1fr; }
      .countdown { gap: 16px; flex-wrap: wrap; }
      .countdown-value { font-size: 40px; }
      .workbar { width: 160px; }
    }

    /* "동작 줄이기" 설정을 켠 사용자에게는 애니메이션 끄기 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="app">

    <!-- ===================================================
         [A] 상단 바: 날짜, 시계, 퇴근 카운트다운
         =================================================== -->
    <header class="area area-top">
      <div class="clock">
        <div class="clock-date" id="clockDate">-</div>
        <div class="clock-time num" id="clockTime">--:--:--</div>
      </div>

      <div class="countdown">
        <div>
          <div class="countdown-label" id="countdownLabel">퇴근까지</div>
          <!-- aria-live: 화면 낭독기가 1초마다 읽지 않도록 꺼둠 -->
          <div class="countdown-value num" id="countdownValue" aria-live="off">-</div>
        </div>
        <div>
          <div class="workbar" role="progressbar" aria-label="오늘 근무 진행률"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="workbar">
            <div class="workbar-fill" id="workbarFill"></div>
          </div>
          <div class="workbar-text num" id="workbarText">근무 시간 -</div>
        </div>
      </div>
    </header>

    <!-- ===================================================
         [B] 이번 주 타임라인 (2단계에서 구현)
         =================================================== -->
    <section class="area area-timeline" aria-labelledby="timelineTitle">
      <div class="tl-head">
        <div class="tl-title">
          <h2 id="timelineTitle">이번 주 타임라인</h2>
          <span class="tl-range num" id="tlRange"></span>
        </div>
        <div class="tl-actions">
          <div class="tl-nav" role="group" aria-label="주 이동">
            <button type="button" class="btn" id="tlPrev">◀ 지난주</button>
            <button type="button" class="btn" id="tlThis">이번 주</button>
            <button type="button" class="btn" id="tlNext">다음 주 ▶</button>
          </div>
          <button type="button" class="btn" id="tlAdd">일정 추가</button>

      <p class="tl-empty" id="tlEmpty" hidden>이번 주 일정이 없어요. 빈 칸을 눌러 추가하세요.</p>

      <div class="tl-scroll">
        <div class="tl-grid" id="tlGrid"></div>
      </div>
    </section>

    <!-- 오른쪽 열 -->
    <div class="side">
      <!-- [C] 다가오는 마감 (4단계에서 구현) -->
      <section class="area" aria-labelledby="deadlineTitle">
        <h2 id="deadlineTitle">다가오는 마감</h2>
        <p class="placeholder">마감일과 D-day가 들어올 자리예요. (4단계)</p>
      </section>

      <!-- [D] 오늘 할 일 3가지 (4단계에서 구현) -->
      <section class="area" aria-labelledby="todoTitle">
        <h2 id="todoTitle">오늘 할 일 3가지</h2>
        <p class="placeholder">오늘 꼭 할 일 3개를 적는 자리예요. (4단계)</p>
      </section>
    </div>

    <!-- ===================================================
         [E] 진행 중인 과제 (5단계에서 구현)
         =================================================== -->
    <section class="area area-tasks" aria-labelledby="tasksTitle">
      <h2 id="tasksTitle">진행 중인 과제</h2>
      <p class="placeholder">과제 카드와 진행률이 들어올 자리예요. (5단계)</p>
    </section>

    <!-- ===================================================
         [F] 바로가기 & 도구 (6단계에서 구현)
         =================================================== -->
    <footer class="area area-tools">
      <div class="tools-links">
        <span class="tools-title">바로가기</span>
        <span class="placeholder">자주 쓰는 사이트 버튼이 들어올 자리예요. (6단계)</span>
      </div>
      <div class="tools-buttons">
        <button type="button" class="btn" disabled title="6단계에서 연결돼요">설정</button>
        <button type="button" class="btn" disabled title="6단계에서 연결돼요">백업</button>
      </div>

  </div>

  <!-- ===================================================
       일정 추가/수정 입력 창
       =================================================== -->
  <dialog class="dialog" id="eventDialog" aria-labelledby="eventDialogTitle">
    <form class="dialog-form" id="eventForm" novalidate>
      <h2 id="eventDialogTitle">일정 추가</h2>

      <label class="field">
        <span class="field-label">제목</span>
        <input class="input" type="text" id="evTitle" maxlength="60" autocomplete="off" placeholder="예: 주간 팀 회의">
      </label>

      <label class="field">
        <span class="field-label">카테고리</span>
        <select class="input" id="evCategory"></select>
      </label>

      <label class="field">
        <span class="field-label" id="evDateLabel">날짜</span>
        <input class="input num" type="date" id="evDate">
      </label>

      <div class="field-row">
        <label class="field">
          <span class="field-label">시작</span>
          <input class="input num" type="time" id="evStart" step="600">
        </label>
        <label class="field">
          <span class="field-label">종료</span>
          <input class="input num" type="time" id="evEnd" step="600">
        </label>
      </div>

      <fieldset class="repeat-days">
        <legend class="field-label">매주 반복 (고르지 않으면 한 번만)</legend>
        <div class="day-checks" id="evRepeat">
          <label class="day-check"><input type="checkbox" value="1" id="evRepeat1"><span>월</span></label>
          <label class="day-check"><input type="checkbox" value="2" id="evRepeat2"><span>화</span></label>
          <label class="day-check"><input type="checkbox" value="3" id="evRepeat3"><span>수</span></label>
          <label class="day-check"><input type="checkbox" value="4" id="evRepeat4"><span>목</span></label>
          <label class="day-check"><input type="checkbox" value="5" id="evRepeat5"><span>금</span></label>
        </div>
        <p class="form-hint" id="evRepeatHint" hidden>반복 일정은 고친 내용이 모든 주에 함께 적용돼요.</p>
      </fieldset>

      <label class="field">
        <span class="field-label">메모 (선택)</span>
        <textarea class="input" id="evMemo" rows="2" maxlength="300"></textarea>
      </label>

      <p class="form-error" id="evError" role="alert" hidden></p>

      <div class="dialog-actions">
        <button type="button" class="btn btn-danger" id="evDelete">삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="evCancel">취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 잠깐 떴다 사라지는 알림 -->
  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    const DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

    /* =========================================================
       1. 작은 도우미 함수들
       ========================================================= */

    // 한 자리 숫자 앞에 0 붙이기 (예: 5 → "05")
    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    // "08:30" 같은 글자를 "자정부터 몇 분째인지" 숫자로 바꾸기 (예: "08:30" → 510)
    function timeToMinutes(text) {
      const [h, m] = text.split(":").map(Number);
      return h * 60 + m;
    }


    // 분(숫자)을 다시 "08:30" 같은 글자로 바꾸기
    function minutesToTime(min) {
      return `${pad2(Math.floor(min / 60))}:${pad2(min % 60)}`;
    }

    // 날짜를 "2026-10-06" 같은 글자로 바꾸기 (저장·비교용)
    function toDateKey(date) {
      return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
    }

    // "2026-10-06" 글자를 날짜로 바꾸기
    function fromDateKey(key) {
      const [y, m, d] = key.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    // 날짜에 며칠 더하기 (원래 날짜는 그대로 두고 새 날짜를 돌려줌)
    function addDays(date, days) {
      const result = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      result.setDate(result.getDate() + days);
      return result;
    }

    // 그 날짜가 속한 주의 월요일 구하기
    function getMonday(date) {
      const day = date.getDay();                 // 0=일 ~ 6=토
      const diff = day === 0 ? -6 : 1 - day;      // 일요일이면 6일 전이 월요일
      return addDays(date, diff);
    }

    // 대시보드가 기본으로 보여줄 주의 월요일
    // - 평일: 이번 주
    // - 토·일: 곧 시작할 다음 주 (주말에 지난 주를 볼 일은 적으니까)
    function getDefaultMonday(today) {
      const day = today.getDay();
      if (day === 6) return addDays(today, 2);
      if (day === 0) return addDays(today, 1);
      return getMonday(today);
    }

    // 겹치지 않는 고유 번호 만들기 (일정·과제 등의 id)
    function makeId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    // "#6FA8DC" 같은 색을 투명도가 있는 색으로 바꾸기 (예: 20% → alpha 0.2)
    function hexToRgba(hex, alpha) {
      const n = parseInt(hex.replace("#", ""), 16);
      return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
    }

    /* =========================================================
       2. 데이터 (샘플)
       - 계획서 4장의 구조 그대로입니다.
       - 처음 열었을 때만 사용합니다. (그 다음부터는 저장된 데이터 사용)
       ========================================================= */
    function createSampleData() {
      // 샘플 일정이 화면에 바로 보이도록, 기본으로 보여줄 주의 월요일을 기준으로 날짜를 정함
      const monday = getDefaultMonday(new Date());
      const dayOf = (offset) => toDateKey(addDays(monday, offset)); // 0=월, 1=화 ...

      return {
        version: 1,
        settings: {
          workStart: "08:00",      // 출근 시각
          workEnd: "17:00",        // 퇴근 시각
          timelineStart: "08:00",  // 타임라인 맨 위 시각
          timelineEnd: "19:00"     // 타임라인 맨 아래 시각
        },
        categories: [
          { id: "meeting",  name: "회의",          color: "#6FA8DC" },
          { id: "focus",    name: "집중 업무",     color: "#7CC4A4" },
          { id: "external", name: "외부 일정",     color: "#B394D9" },
          { id: "admin",    name: "행정·결재",     color: "#9AA6B8" },
          { id: "personal", name: "개인(운동 등)", color: "#E58C78" }
        ],
        events: [
          // repeatDays: 비어 있으면 1회성, [1,3,5]면 월·수·금 매주 반복 (1=월 … 5=금)
          { id: makeId(), title: "주간 팀 회의",   categoryId: "meeting",  date: dayOf(0), start: "10:00", end: "11:00", repeatDays: [1],       memo: "" },
          { id: makeId(), title: "결재 문서 검토", categoryId: "admin",    date: dayOf(0), start: "10:30", end: "11:30", repeatDays: [],        memo: "" },
          { id: makeId(), title: "집중 업무 블록", categoryId: "focus",    date: dayOf(1), start: "09:00", end: "11:30", repeatDays: [2, 4],    memo: "" },
          { id: makeId(), title: "협력기관 미팅",  categoryId: "external", date: dayOf(2), start: "14:00", end: "16:00", repeatDays: [],        memo: "" },
          { id: makeId(), title: "운동",           categoryId: "personal", date: dayOf(0), start: "17:30", end: "18:30", repeatDays: [1, 3, 5], memo: "" }
        ],
        tasks: [],        // 5단계에서 사용
        deadlines: [],    // 4단계에서 사용
        todayTodos: {},   // 4단계에서 사용
        links: []         // 6단계에서 사용
      };
    }

    /* =========================================================
       3. 브라우저 저장 (localStorage)
       - 내 PC의 브라우저 안에만 저장됩니다. (서버로 보내지 않음)
       - 저장된 게 없거나 깨져 있으면 샘플 데이터로 시작합니다.
       ========================================================= */
    const STORAGE_KEY = "commandCenter.data";
    const CURRENT_VERSION = 1;

    // 옛날 구조의 데이터를 지금 구조로 바꾸기
    // - 나중에 구조가 바뀌면 여기에 "version 1 → 2" 변환을 추가합니다.
    function migrate(raw) {
      if (raw.version === CURRENT_VERSION) return raw;
      // 예시) if (raw.version === 1) { ...바꾸기...; raw.version = 2; }
      return null;  // 알 수 없는 버전
    }

    // 불러온 데이터에 빠진 칸이 있으면 기본값으로 채우고, 이상한 일정은 걸러냄
    function normalizeData(raw) {
      const base = createSampleData();
      const isTime = (t) => typeof t === "string" && /^\d{2}:\d{2}$/.test(t);
      const isDate = (d) => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d);

      return {
        version: CURRENT_VERSION,
        settings: { ...base.settings, ...(raw.settings || {}) },
        categories: Array.isArray(raw.categories) && raw.categories.length ? raw.categories : base.categories,
        events: (Array.isArray(raw.events) ? raw.events : [])
          .filter(e => e && typeof e.title === "string" && isDate(e.date) && isTime(e.start) && isTime(e.end))
          .map(e => ({
            id: e.id || makeId(),
            title: e.title,
            categoryId: e.categoryId,
            date: e.date,
            start: e.start,
            end: e.end,
            repeatDays: Array.isArray(e.repeatDays) ? e.repeatDays.map(Number) : [],
            memo: typeof e.memo === "string" ? e.memo : ""
          })),
        tasks: Array.isArray(raw.tasks) ? raw.tasks : [],
        deadlines: Array.isArray(raw.deadlines) ? raw.deadlines : [],
        todayTodos: raw.todayTodos && typeof raw.todayTodos === "object" ? raw.todayTodos : {},
        links: Array.isArray(raw.links) ? raw.links : []
      };
    }

    // 저장된 데이터 불러오기
    function loadData() {
      let text = null;
      try {
        text = localStorage.getItem(STORAGE_KEY);
      } catch (err) {
        // 브라우저 설정으로 저장소를 쓸 수 없는 경우
        console.warn("저장소를 읽을 수 없어요:", err);
      }

      // 처음 열었을 때: 샘플 데이터로 시작하고 바로 저장
      if (!text) {
        const sample = createSampleData();
        saveData(sample, true);
        return sample;
      }

      try {
        const migrated = migrate(JSON.parse(text));
        if (!migrated) throw new Error("알 수 없는 데이터 버전");
        return normalizeData(migrated);
      } catch (err) {
        // 데이터가 깨져 있으면 원래 내용을 따로 보관해 두고 샘플로 시작
        console.warn("저장된 데이터가 깨져 있어요:", err);
        try {
          localStorage.setItem(STORAGE_KEY + ".broken", text);
        } catch (e) { /* 보관도 못 하면 그냥 넘어감 */ }
        showToast("저장된 데이터를 읽지 못해 샘플로 시작했어요.", true);
        return createSampleData();
      }
    }

    // 데이터 저장하기 (silent=true면 실패해도 알림을 띄우지 않음)
    function saveData(target = data, silent = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(target));
        return true;
      } catch (err) {
        console.warn("저장하지 못했어요:", err);
        if (!silent) showToast("저장하지 못했어요. 브라우저 저장 공간이나 설정을 확인해 주세요.", true);
        return false;
      }
    }

    // 화면 아래에 잠깐 알림 띄우기
    let toastTimer = null;
    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.toggle("is-error", isError);
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, isError ? 5000 : 2500);
    }

    const data = loadData();

    // 화면 요소를 id로 찾아두기
    const el = {
      clockDate: document.getElementById("clockDate"),
      clockTime: document.getElementById("clockTime"),
      countdownLabel: document.getElementById("countdownLabel"),
      countdownValue: document.getElementById("countdownValue"),
      workbar: document.getElementById("workbar"),
      workbarFill: document.getElementById("workbarFill"),
      workbarText: document.getElementById("workbarText"),
      tlGrid: document.getElementById("tlGrid"),
      tlRange: document.getElementById("tlRange"),
      tlEmpty: document.getElementById("tlEmpty"),
      tlPrev: document.getElementById("tlPrev"),
      tlThis: document.getElementById("tlThis"),
      tlNext: document.getElementById("tlNext"),
      tlAdd: document.getElementById("tlAdd"),
      // 일정 입력 창
      evDialog: document.getElementById("eventDialog"),
      evForm: document.getElementById("eventForm"),
      evDialogTitle: document.getElementById("eventDialogTitle"),
      evTitle: document.getElementById("evTitle"),
      evCategory: document.getElementById("evCategory"),
      evDate: document.getElementById("evDate"),
      evDateLabel: document.getElementById("evDateLabel"),
      evStart: document.getElementById("evStart"),
      evEnd: document.getElementById("evEnd"),
      evRepeat: document.getElementById("evRepeat"),
      evRepeatHint: document.getElementById("evRepeatHint"),
      evMemo: document.getElementById("evMemo"),
      evError: document.getElementById("evError"),
      evDelete: document.getElementById("evDelete"),
      evCancel: document.getElementById("evCancel")
    };

    /* =========================================================
       4. [A] 날짜와 시계 그리기
       ========================================================= */
    function renderClock(now) {
      // 예: "10월 6일 화요일"
      el.clockDate.textContent =
        `${now.getMonth() + 1}월 ${now.getDate()}일 ${DAY_NAMES[now.getDay()]}요일`;

      // 예: "14:32:05"
      el.clockTime.textContent =
        `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
    }

    /* =========================================================
       5. [A] 퇴근 카운트다운 그리기
       - 주말 → "주말"
       - 출근 시각 전 → "출근 전"
       - 근무 중 → "2시간 27분" + 진행률 막대
       - 퇴근 시각 후 → "퇴근 완료"
       ========================================================= */

    // 카운트다운 칸에 상태 문구 보여주기 ("출근 전", "주말" 등)
    function showStatus(text) {
      el.countdownValue.textContent = text;
      el.countdownValue.classList.add("is-status");
    }

    // 카운트다운 칸에 "2시간 27분" 형식으로 남은 시간 보여주기
    function showRemaining(totalMinutes) {
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;

      el.countdownValue.classList.remove("is-status");
      el.countdownValue.textContent = "";  // 기존 내용 비우기

      // 숫자와 단위를 따로 만들어 단위만 작게 표시
      // (textContent만 사용해 안전하게 화면에 넣음)
      function addPart(number, unitText) {
        el.countdownValue.append(String(number));
        const unit = document.createElement("span");
        unit.className = "unit";
        unit.textContent = unitText;
        el.countdownValue.append(unit);
      }

      if (hours > 0) addPart(hours, "시간");
      addPart(minutes, "분");
    }

    // 진행률 막대 채우기 (0~100)
    function setWorkProgress(percent) {
      const value = Math.round(percent);
      el.workbarFill.style.width = value + "%";
      el.workbar.setAttribute("aria-valuenow", value);
    }

    function renderCountdown(now) {
      const day = now.getDay();             // 0=일요일, 6=토요일
      const start = timeToMinutes(data.settings.workStart);
      const end = timeToMinutes(data.settings.workEnd);
      // 지금이 자정부터 몇 분째인지 (초까지 반영해 소수로 계산)
      const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

      el.workbarText.textContent = `근무 시간 ${data.settings.workStart}–${data.settings.workEnd}`;

      // 주말
      if (day === 0 || day === 6) {
        el.countdownLabel.textContent = "오늘은";
        showStatus("주말");
        setWorkProgress(0);
        return;
      }

      // 출근 전
      if (nowMin < start) {
        el.countdownLabel.textContent = "지금은";
        showStatus("출근 전");
        setWorkProgress(0);
        return;
      }

      // 퇴근 후
      if (nowMin >= end) {
        el.countdownLabel.textContent = "오늘 근무";
        showStatus("퇴근 완료");
        setWorkProgress(100);
        return;
      }

      // 근무 중: 남은 시간을 분 단위로 내림 (예: 2시간 27분 55초 → "2시간 27분")
      el.countdownLabel.textContent = "퇴근까지";
      showRemaining(Math.floor(end - nowMin));
      setWorkProgress(((nowMin - start) / (end - start)) * 100);
    }

    /* =========================================================
       6. [B] 이번 주 타임라인 그리기
       ========================================================= */

    // 지금 화면에 보여주고 있는 주의 월요일 (◀ ▶ 버튼으로 바뀜)
    let viewMonday = getDefaultMonday(new Date());

    // 특정 날짜에 이 일정이 있는지 확인 (반복 일정 포함)
    function occursOn(event, date) {
      const key = toDateKey(date);
      // 1회성 일정: 날짜가 같으면 있음
      if (event.repeatDays.length === 0) return event.date === key;
      // 반복 일정: 요일이 맞고, 시작일(date) 이후면 있음
      return event.repeatDays.includes(date.getDay()) && key >= event.date;
    }

    // 카테고리 id로 카테고리 정보 찾기 (못 찾으면 회색 기본값)
    function findCategory(id) {
      return data.categories.find(c => c.id === id) || { name: "기타", color: "#9AA6B8" };
    }

    // 하루 일정들의 겹침을 계산해서 각 일정에 "몇 번째 칸(col) / 전체 몇 칸(cols)"을 붙임
    // - 시간이 겹치는 일정끼리 한 묶음으로 보고,
    // - 묶음 안에서 비어 있는 가장 왼쪽 칸에 차례로 넣습니다.
    function layoutDay(items) {
      items.sort((a, b) => a.startMin - b.startMin || a.endMin - b.endMin);

      let group = [];       // 지금 만들고 있는 겹침 묶음
      let colEnds = [];     // 각 칸이 언제 비는지 (끝나는 시각)
      let groupEnd = -1;    // 묶음 전체가 끝나는 시각

      // 묶음 하나가 끝나면 그 묶음의 칸 수를 기록
      function closeGroup() {
        group.forEach(item => { item.cols = colEnds.length; });
        group = [];
        colEnds = [];
      }

      items.forEach(item => {
        // 앞 묶음과 전혀 안 겹치면 새 묶음 시작
        if (item.startMin >= groupEnd) closeGroup();

        // 비어 있는 칸 찾기 (없으면 새 칸)
        let col = colEnds.findIndex(end => end <= item.startMin);
        if (col === -1) {
          col = colEnds.length;
          colEnds.push(item.endMin);
        } else {
          colEnds[col] = item.endMin;
        }
        item.col = col;
        group.push(item);
        groupEnd = Math.max(groupEnd, item.endMin);
      });
      closeGroup();
      return items;
    }

    // 일정 블록 하나 만들기
    function createEventBlock(item, tlStart, hourPx) {
      const category = findCategory(item.event.categoryId);
      // 누르면 수정 창이 열리도록 버튼으로 만듦 (키보드 Tab으로도 이동 가능)
      const block = document.createElement("button");
      block.type = "button";
      block.className = "tl-event";

      // 세로 위치·높이: (시작 - 타임라인 시작) 분 → px
      const top = (item.startMin - tlStart) / 60 * hourPx;
      const height = (item.endMin - item.startMin) / 60 * hourPx;
      block.style.top = top + "px";
      block.style.height = Math.max(height - 2, 14) + "px";  // 2px 빼서 위아래 블록 사이 틈

      // 가로 위치·폭: 겹치는 일정이 있으면 열을 나눠서 나란히
      const widthPct = 100 / item.cols;
      block.style.left = `calc(${item.col * widthPct}% + 2px)`;
      block.style.width = `calc(${widthPct}% - 4px)`;

      // 카테고리 색 (CSS에서 --cat-color, --cat-bg로 사용)
      block.style.setProperty("--cat-color", category.color);
      block.style.setProperty("--cat-bg", hexToRgba(category.color, 0.2));

      if (item.endMin - item.startMin <= 30) block.classList.add("is-short");

      // 글자는 textContent로만 넣기 (스크립트 삽입 방지)
      const timeText = `${item.event.start}–${item.event.end}`;
      const title = document.createElement("span");
      title.className = "tl-event-title";
      title.textContent = item.event.title;
      const time = document.createElement("span");
      time.className = "tl-event-time num";
      time.textContent = timeText;
      block.append(title, time);

      // 마우스를 올리면 전체 내용 표시 (블록이 좁아 글자가 잘릴 때 도움)
      block.title = `${item.event.title}\n${timeText} · ${category.name}`;

      block.addEventListener("click", () => openEventDialog({ event: item.event }));
      return block;
    }

    // 타임라인 전체 그리기
    function renderTimeline() {
      const today = new Date();
      const todayKey = toDateKey(today);
      const tlStart = timeToMinutes(data.settings.timelineStart);
      const tlEnd = timeToMinutes(data.settings.timelineEnd);
      // CSS 변수 --hour-h 값(1시간 높이)을 읽어옴
      const hourPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour-h")) || 52;
      const bodyHeight = (tlEnd - tlStart) / 60 * hourPx;

      const grid = el.tlGrid;
      grid.textContent = "";  // 이전 내용 지우기

      // 월~금 5일의 날짜 목록
      const days = [0, 1, 2, 3, 4].map(i => addDays(viewMonday, i));

      // ── 위쪽 머리글 줄: 빈 칸 + 요일 5개 ──
      const corner = document.createElement("div");
      corner.className = "tl-corner";
      grid.append(corner);

      days.forEach(date => {
        const head = document.createElement("div");
        head.className = "tl-dayhead num";
        const name = document.createElement("span");
        name.className = "day-name";
        name.textContent = DAY_NAMES[date.getDay()];
        const dateText = document.createElement("span");
        dateText.textContent = `${date.getMonth() + 1}/${date.getDate()}`;
        head.append(name, dateText);
        if (toDateKey(date) === todayKey) {
          head.classList.add("is-today");
          const mark = document.createElement("span");
          mark.className = "today-mark";
          mark.textContent = "오늘";
          head.append(mark);
        }
        grid.append(head);
      });

      // ── 왼쪽 시간 눈금 ──
      const hours = document.createElement("div");
      hours.className = "tl-hours";
      hours.style.height = bodyHeight + "px";
      for (let m = Math.ceil(tlStart / 60) * 60; m < tlEnd; m += 60) {
        const label = document.createElement("div");
        label.className = "tl-hour-label num";
        label.style.top = (m - tlStart) / 60 * hourPx + "px";
        label.textContent = pad2(m / 60);
        hours.append(label);
      }
      grid.append(hours);

      // ── 요일 열 5개 + 일정 블록 ──
      let eventCount = 0;
      days.forEach(date => {
        const col = document.createElement("div");
        col.className = "tl-col";
        col.style.height = bodyHeight + "px";
        if (toDateKey(date) === todayKey) col.classList.add("is-today");

        // 빈 칸을 누르면 → 그 요일·시간(30분 단위)으로 일정 추가 창 열기
        col.addEventListener("click", (e) => {
          if (e.target.closest(".tl-event")) return;  // 일정 블록을 누른 경우는 제외
          const y = e.clientY - col.getBoundingClientRect().top;
          const startMin = tlStart + Math.floor(y / hourPx * 2) * 30;
          openEventDialog({
            date: toDateKey(date),
            start: minutesToTime(startMin),
            end: minutesToTime(Math.min(startMin + 60, tlEnd))
          });
        });

        // 이 날의 일정만 골라서, 타임라인 범위 안으로 잘라 둠
        const items = data.events
          .filter(event => occursOn(event, date))
          .map(event => ({
            event,
            startMin: Math.max(timeToMinutes(event.start), tlStart),
            endMin: Math.min(timeToMinutes(event.end), tlEnd)
          }))
          .filter(item => item.endMin > item.startMin);  // 범위 밖 일정은 제외

        layoutDay(items).forEach(item => {
          col.append(createEventBlock(item, tlStart, hourPx));
        });
        eventCount += items.length;
        grid.append(col);
      });

      // ── 제목 옆 날짜 범위, 빈 주 안내, 이번 주 버튼 상태 ──
      const friday = days[4];
      el.tlRange.textContent =
        `${viewMonday.getMonth() + 1}월 ${viewMonday.getDate()}일 – ${friday.getMonth() + 1}월 ${friday.getDate()}일`;
      el.tlEmpty.hidden = eventCount > 0;
      const isDefaultWeek = toDateKey(viewMonday) === toDateKey(getDefaultMonday(today));
      el.tlThis.setAttribute("aria-pressed", String(isDefaultWeek));

      renderNowLine(today);
    }

    // 현재 시각 가로선 그리기 (오늘 열에만, 타임라인 시간 범위 안일 때만)
    function renderNowLine(now) {
      const old = el.tlGrid.querySelector(".tl-now");
      if (old) old.remove();

      const todayCol = el.tlGrid.querySelector(".tl-col.is-today");
      if (!todayCol) return;  // 보고 있는 주에 오늘이 없음

      const tlStart = timeToMinutes(data.settings.timelineStart);
      const tlEnd = timeToMinutes(data.settings.timelineEnd);
      const nowMin = now.getHours() * 60 + now.getMinutes();
      if (nowMin < tlStart || nowMin > tlEnd) return;  // 타임라인 시간 밖

      const hourPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour-h")) || 52;
      const line = document.createElement("div");
      line.className = "tl-now";
      line.style.top = ((nowMin - tlStart) / 60 * hourPx - 1) + "px";
      todayCol.append(line);
    }

    // 주 이동 버튼
    el.tlPrev.addEventListener("click", () => {
      viewMonday = addDays(viewMonday, -7);
      renderTimeline();
    });
    el.tlNext.addEventListener("click", () => {
      viewMonday = addDays(viewMonday, 7);
      renderTimeline();
    });
    el.tlThis.addEventListener("click", () => {
      viewMonday = getDefaultMonday(new Date());
      renderTimeline();
    });

    /* =========================================================
       7. 일정 추가/수정/삭제 입력 창
       ========================================================= */
    let editingId = null;      // 수정 중인 일정 id (새 일정이면 null)
    let deleteArmed = false;   // 삭제 버튼을 한 번 눌렀는지 (두 번 눌러야 삭제)

    // 반복 요일 체크박스들
    function repeatChecks() {
      return [...el.evRepeat.querySelectorAll("input[type=checkbox]")];
    }

    // 반복을 고르면 "날짜" 이름표를 "반복 시작일"로 바꿔 보여줌
    function updateRepeatLabel() {
      const repeating = repeatChecks().some(c => c.checked);
      el.evDateLabel.textContent = repeating ? "반복 시작일" : "날짜";
      el.evRepeatHint.hidden = !(repeating && editingId);
    }

    function resetDeleteButton() {
      deleteArmed = false;
      el.evDelete.textContent = "삭제";
    }

    // 입력 창 열기
    // - 새 일정: openEventDialog({ date, start, end })
    // - 수정:    openEventDialog({ event })
    function openEventDialog({ event = null, date, start, end }) {
      editingId = event ? event.id : null;
      resetDeleteButton();
      el.evError.hidden = true;

      // 카테고리 목록 채우기 (설정에서 바뀔 수 있으므로 매번 새로)
      el.evCategory.textContent = "";
      data.categories.forEach(c => {
        const option = document.createElement("option");
        option.value = c.id;
        option.textContent = c.name;
        el.evCategory.append(option);
      });

      if (event) {
        el.evDialogTitle.textContent = "일정 수정";
        el.evTitle.value = event.title;
        el.evCategory.value = event.categoryId;
        el.evDate.value = event.date;
        el.evStart.value = event.start;
        el.evEnd.value = event.end;
        el.evMemo.value = event.memo || "";
        repeatChecks().forEach(c => { c.checked = event.repeatDays.includes(Number(c.value)); });
        el.evDelete.hidden = false;
      } else {
        el.evDialogTitle.textContent = "일정 추가";
        el.evTitle.value = "";
        el.evCategory.value = data.categories[0] ? data.categories[0].id : "";
        el.evDate.value = date;
        el.evStart.value = start;
        el.evEnd.value = end;
        el.evMemo.value = "";
        repeatChecks().forEach(c => { c.checked = false; });
        el.evDelete.hidden = true;
      }
      updateRepeatLabel();

      el.evDialog.showModal();
      el.evTitle.focus();
    }

    function closeEventDialog() {
      el.evDialog.close();
    }

    function showFormError(message) {
      el.evError.textContent = message;
      el.evError.hidden = false;
    }

    // 저장 버튼 (Enter 키로도 저장)
    el.evForm.addEventListener("submit", (e) => {
      e.preventDefault();  // 페이지가 새로고침되지 않게 막음

      const title = el.evTitle.value.trim();
      const startText = el.evStart.value;
      const endText = el.evEnd.value;

      // 입력값 확인
      if (!title) { showFormError("제목을 입력해 주세요."); el.evTitle.focus(); return; }
      if (!el.evDate.value) { showFormError("날짜를 골라 주세요."); el.evDate.focus(); return; }
      if (!startText || !endText) { showFormError("시작과 종료 시각을 입력해 주세요."); return; }
      if (timeToMinutes(endText) <= timeToMinutes(startText)) {
        showFormError("종료 시각은 시작 시각보다 늦어야 해요.");
        el.evEnd.focus();
        return;
      }

      const values = {
        title,
        categoryId: el.evCategory.value,
        date: el.evDate.value,
        start: startText,
        end: endText,
        repeatDays: repeatChecks().filter(c => c.checked).map(c => Number(c.value)),
        memo: el.evMemo.value.trim()
      };

      if (editingId) {
        // 수정: 같은 id의 일정을 새 값으로 바꿈
        const target = data.events.find(ev => ev.id === editingId);
        if (target) Object.assign(target, values);
      } else {
        // 추가
        data.events.push({ id: makeId(), ...values });
      }

      if (saveData()) showToast(editingId ? "일정을 고쳤어요." : "일정을 추가했어요.");
      closeEventDialog();
      renderTimeline();
    });

    // 삭제 버튼: 실수 방지를 위해 두 번 눌러야 삭제
    el.evDelete.addEventListener("click", () => {
      if (!deleteArmed) {
        deleteArmed = true;
        const target = data.events.find(ev => ev.id === editingId);
        const isRepeat = target && target.repeatDays.length > 0;
        el.evDelete.textContent = isRepeat ? "반복 일정 전체 삭제" : "한 번 더 누르면 삭제";
        return;
      }
      data.events = data.events.filter(ev => ev.id !== editingId);
      if (saveData()) showToast("일정을 삭제했어요.");
      closeEventDialog();
      renderTimeline();
    });

    el.evCancel.addEventListener("click", closeEventDialog);
    el.evRepeat.addEventListener("change", updateRepeatLabel);

    // 창 바깥(어두운 부분)을 누르면 닫기
    // (Esc 키로 닫기는 <dialog>가 기본으로 해줌)
    el.evDialog.addEventListener("click", (e) => {
      if (e.target === el.evDialog) closeEventDialog();
    });

    // 위쪽 "일정 추가" 버튼: 보고 있는 주에 오늘이 있으면 오늘, 없으면 그 주 월요일
    el.tlAdd.addEventListener("click", () => {
      const now = new Date();
      const todayKey = toDateKey(now);
      const weekKeys = [0, 1, 2, 3, 4].map(i => toDateKey(addDays(viewMonday, i)));
      const tlStart = timeToMinutes(data.settings.timelineStart);
      const tlEnd = timeToMinutes(data.settings.timelineEnd);
      // 다음 정각 (타임라인 범위 안으로)
      let startMin = Math.ceil((now.getHours() * 60 + now.getMinutes()) / 60) * 60;
      startMin = Math.min(Math.max(startMin, tlStart), tlEnd - 60);
      openEventDialog({
        date: weekKeys.includes(todayKey) ? todayKey : weekKeys[0],
        start: minutesToTime(startMin),
        end: minutesToTime(startMin + 60)
      });
    });

    /* =========================================================
       8. 1초마다 화면 갱신
       - 시계·카운트다운: 매초
       - 현재 시각 선: 분이 바뀔 때만
       - 타임라인 전체: 날짜가 바뀔 때만 (오늘 강조 위치 이동)
       ========================================================= */
    let lastMinute = -1;
    let lastDateKey = toDateKey(new Date());

    function tick() {
      const now = new Date();
      renderClock(now);
      renderCountdown(now);

      const dateKey = toDateKey(now);
      if (dateKey !== lastDateKey) {
        lastDateKey = dateKey;
        renderTimeline();
      } else if (now.getMinutes() !== lastMinute) {
        renderNowLine(now);
      }
      lastMinute = now.getMinutes();
    }

    renderTimeline();           // 처음 열었을 때 타임라인 그리기
    tick();                     // 시계도 바로 한 번 그리기
    setInterval(tick, 1000);    // 그 다음부터 1초마다 다시 그리기
  </script>
</body>
</html>
